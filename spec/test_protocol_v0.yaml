schema_version: 1
protocol_name: test_protocol_v0
byte_order: little
bit_order: lsb_first

sequence:
  bits: 32
  initial: 0
  modulus: 4294967296

frame:
  version: 0
  sof: [165, 90]
  header_size: 6
  max_payload_bytes: 1024
  fields:
    - {name: sof, offset: 0, size: 2, type: bytes}
    - {name: version, offset: 2, size: 1, type: u8}
    - {name: message_type, offset: 3, size: 1, type: u8}
    - {name: flags, offset: 4, size: 2, type: u16}
    - {name: payload_length, offset: 6, size: 2, type: u16}

message_types:
  ping: 1
  pong: 2
  token_request: 16
  token_result: 17
  error_response: 127

crc32c:
  polynomial: 517762881
  reflected_polynomial: 2197175160
  initial: 4294967295
  xor_out: 4294967295

token_record:
  version: 1
  base_size: 40
  fields:
    - {name: record_version, offset: 0, size: 1, type: u8}
    - {name: flags, offset: 1, size: 1, type: u8}
    - {name: base_length, offset: 2, size: 2, type: u16}
    - {name: stream_id, offset: 4, size: 4, type: u32}
    - {name: sequence, offset: 8, size: 4, type: u32}
    - {name: token_id, offset: 12, size: 4, type: u32}
    - {name: importance, offset: 16, size: 1, type: u8}
    - {name: reserved_0, offset: 17, size: 3, type: bytes}
    - {name: generated_time_us, offset: 20, size: 8, type: u64}
    - {name: deadline_us, offset: 28, size: 8, type: u64}
    - {name: extension_length, offset: 36, size: 2, type: u16}
    - {name: reserved_1, offset: 38, size: 2, type: u16}

token_flags:
  generated_time_valid: 1
  deadline_valid: 2

extension_tlv:
  header_size: 2
  max_value_bytes: 255

protection_request:
  version: 1
  size: 16
  fields:
    - {name: request_version, offset: 0, size: 1, type: u8}
    - {name: mode, offset: 1, size: 1, type: u8}
    - {name: flags, offset: 2, size: 2, type: u16}
    - {name: block_length_bits, offset: 4, size: 2, type: u16}
    - {name: repetition_count, offset: 6, size: 1, type: u8}
    - {name: reserved_0, offset: 7, size: 1, type: u8}
    - {name: code_rate_num, offset: 8, size: 2, type: u16}
    - {name: code_rate_den, offset: 10, size: 2, type: u16}
    - {name: reserved_1, offset: 12, size: 4, type: u32}

protection_modes:
  none: 0
  repetition: 1
  hamming_7_4: 2

channel_state:
  version: 1
  size: 4
  fields:
    - {name: state_version, offset: 0, size: 1, type: u8}
    - {name: flags, offset: 1, size: 1, type: u8}
    - {name: channel_quality, offset: 2, size: 2, type: u16}

channel_flags:
  quality_valid: 1

result_status:
  size: 8
  fields:
    - {name: flags, offset: 0, size: 4, type: u32}
    - {name: corrected_count, offset: 4, size: 2, type: u16}
    - {name: detected_error_count, offset: 6, size: 2, type: u16}

result_flags:
  parity_error: 1
  fec_corrected: 2
  crc_error: 4
  malformed_frame: 8
  malformed_request: 16
  unsupported_version: 32
  unsupported_protection: 64
  sequence_gap: 128
  uart_framing_error: 256
  internal_overflow: 512

error_response:
  size: 8
  fields:
    - {name: flags, offset: 0, size: 4, type: u32}
    - {name: request_message_type, offset: 4, size: 1, type: u8}
    - {name: reserved, offset: 5, size: 3, type: bytes}

stream:
  byte_data_bits: 8
  bit_data_bits: 1
