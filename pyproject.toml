[project]
name = "llm-token-fec-fpga"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "yosuke", email = "44825231+yosukev2@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.27.0",
    "llama-cpp-python>=0.3.34",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "polars>=1.43.2",
    "pyyaml>=6.0.3",
    "scipy>=1.18.0",
    "tqdm>=4.70.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
ci = [
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.16.2",
]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
extend-select = ["D"]
ignore = ["D105"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]
"**/__init__.py" = ["D104"]
