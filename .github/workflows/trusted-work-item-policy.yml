name: Trusted work item policy

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  issues:
    types: [edited, closed, reopened]
  delete: {}
  repository_dispatch:
    types: [work-item-refresh]
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

concurrency:
  group: work-item-policy-${{ github.repository }}
  cancel-in-progress: true

jobs:
  refresh-work-items:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch || github.ref_name }}
          persist-credentials: false
      - name: Refresh work item policy
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $targetUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          ./scripts/work_item_status.ps1 all -Repository $env:REPOSITORY -TargetUrl $targetUrl
