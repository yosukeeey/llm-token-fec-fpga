name: Work item
description: Define one independently reviewable change.
title: ""
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: State one observable outcome.
      placeholder: The completed system can...
    validations:
      required: true
  - type: textarea
    id: in_scope
    attributes:
      label: In scope
      description: List files, components, and behavior included in this Issue.
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: List adjacent work excluded from this Issue. Enter None when empty.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Record hardware, protocol, compatibility, safety, and dependency constraints. Enter None when empty.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List independently observable pass conditions.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: List exact commands and required evidence.
    validations:
      required: true
  - type: checkboxes
    id: isolation
    attributes:
      label: Work item isolation
      options:
        - label: This Issue will use one branch, one worktree, and one PR.
          required: true
